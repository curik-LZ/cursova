    <div>
        <div class="zak" align="center">
            <form>

                        <option disabled>Луганськ</option>
                        <option>Луцьк</option>
                        <option selected>Львів</option>
                        <option>Миколаїв</option>

                        <option>Чернігів</option>
                    </select>
                </fieldset>
                <fieldset>
                    <legend>
                        Куди
                    </legend>
                    <select>
                        <option>Вінниця</option>
                        <option>Дніпро</option>
                        <option disabled>Донецьк</option>
                        <option>Житомир</option>
                        <option>Запоріжжя</option>
                        <option>Івано-Франківськ</option>
                        <option selected>Київ</option>
                        <option>Кропивницький</option>
                        <option disabled>Луганськ</option>

                    </select>
                </fieldset>
                <fieldset>
                    <legend>Дата виїзду</legend>
                    <input type="date" name="trip-date" value="2025-06-01">
                </fieldset>        
                <fieldset>
                    <legend>Кількість осіб</legend>
                    <div class="pasiki">
                        <button type="button" class="decrease">−</button>
                        <input type="number" id="pas" value="1" min="1">
                        <button type="button" class="increase">+</button>
                    </div>
                </fieldset>
                <button type="button" onclick="window.location.href='result.html'" class="qqq">
                    Підтвердити
                </button>                                      
            </form>
        </div>
        <script>
            const decreaseBtn = document.querySelector('.decrease');
            const increaseBtn = document.querySelector('.increase');
            const input = document.getElementById('pas');
            decreaseBtn.addEventListener('click', () => {
                if (parseInt(input.value) > parseInt(input.min)) {
                    input.value = parseInt(input.value) - 1;
                }
            });
            increaseBtn.addEventListener('click', () => {
                input.value = parseInt(input.value) + 1;
            });
        </script>
